# 可乐 · 桌面版 —— Cargo 工作区（virtual manifest）
# 2026-10-15 05:20

## 工作区
[workspace]
members = [
    "client", # 客户端 bin
    "crates/cola_auth",  # 验证
    "crates/cola_data",  # 数据中心
    "crates/cola_infra", # 基础设施 (💡 - 可独立打包成静态库给Android / iOS 使用)
    "crates/cola_video", # 短视频
]

## 二进制
default-members = ["client"]

## 依赖解析器
resolver = "3"

#  BUILD
#[profile.release]
#opt-level = 3
#strip = true               # 剥离调试符号，减小exe体积
#panic = "abort"            # panic直接终止，减少panic unwind代码，缩小二进制
#lto = true                 # 链接时优化，大幅度瘦身+性能提升
#codegen-units = 1          # 和LTO搭配，最大化优化；编译会慢一点
#debug = false              # 不嵌入调试信息
#debug-assertions = false
#overflow-checks = false
