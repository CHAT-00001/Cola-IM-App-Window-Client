#### 可乐 数据中心
# 2025-12-20 17:52

[package]
name = "cola_data"
version = "0.1.0"
edition = "2024"

[dependencies]
## 内部依赖 (⚠️ 中立lib 不能依赖别的crate)

## 外部依赖
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
chrono = { version =  "0.4.44", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "bigdecimal", "chrono", "rust_decimal"] }
uuid = { version = "1.23.1", features = ["v4", "v7"] }
futures = "0.3.32"
# 自动验证
validator = { version = "0.20.0", features = ["derive"] }
ipnetwork = "0.20.0"
async-trait = "0.1.89"
anyhow = "1.0.99"
rust_decimal = { version = "1.42.1", features = ["serde", "serde-str"] }
snowflake = "1.3.0"
